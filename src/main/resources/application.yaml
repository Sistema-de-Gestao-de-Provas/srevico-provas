spring:
  application:
    name: servico-provas
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/sgp
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Garante o schema do serviço antes do Liquibase e do Hibernate usarem a conexão.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${spring.liquibase.default-schema}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${spring.liquibase.default-schema}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: provas
    # As tabelas de controle do Liquibase ficam no public, pois o schema do serviço
    # ainda não existe quando o Liquibase inicia.
    liquibase-schema: public
    parameters:
      schema: ${spring.liquibase.default-schema}
  # Mensagens de erro da API sempre em pt_BR (i18n/messages_pt_BR.properties)
  web:
    locale: pt_BR
    locale-resolver: fixed
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.server-url}/realms/${keycloak.realm}

keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:sgp}

# URLs base dos serviços usados para validar dados que pertencem a eles
servico-usuarios:
  url: ${SERVICO_USUARIOS_URL:http://localhost:8081/api}

servico-questoes:
  url: ${SERVICO_QUESTOES_URL:http://localhost:8082/api}

server:
  port: 8083
  servlet:
    context-path: /api
